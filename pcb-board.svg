<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580">
<style>
/* data packet travels along a trace */
@keyframes pkt {
  0%   { stroke-dashoffset:0;    opacity:0; }
  6%   { opacity:0.95; }
  75%  { stroke-dashoffset:-100; opacity:0.9; }
  100% { stroke-dashoffset:-100; opacity:0; }
}
.ta {
  stroke:#e8c055; stroke-width:2; fill:none; stroke-linecap:round;
  stroke-dasharray:7 93;
  animation: pkt 2.8s ease-in infinite;
}
.ta1{ animation-delay:0s;    }
.ta2{ animation-delay:0.45s; }
.ta3{ animation-delay:0.9s;  }
.ta4{ animation-delay:1.35s; }
.ta5{ animation-delay:1.8s;  }
.ta6{ animation-delay:2.25s; }
.ta7{ animation-delay:2.7s;  }

/* via pulsing */
@keyframes vp {
  0%,100%{ opacity:0.4; }
  50%    { opacity:1;   }
}
.vp { animation: vp 2s ease-in-out infinite; }
.v1 { animation-delay:0s;    }
.v2 { animation-delay:0.3s;  }
.v3 { animation-delay:0.65s; }
.v4 { animation-delay:1s;    }
.v5 { animation-delay:1.35s; }
.v6 { animation-delay:1.7s;  }

/* IC processing flash */
@keyframes ic-busy {
  0%,78%,100%{ opacity:0; }
  82%,95%    { opacity:0.18; }
}
.ic-glow { animation: ic-busy 4.5s linear infinite; }

/* power LED blink */
@keyframes pwr {
  0%,45%,55%,100%{ opacity:1; }
  48%,52%        { opacity:0.08; }
}
.pwr-led { animation: pwr 3.4s ease infinite; }

/* scan line sweeping down the board */
@keyframes scan {
  0%  { transform:translateY(0);    opacity:0;    }
  4%  { opacity:0.35; }
  96% { opacity:0.2;  }
  100%{ transform:translateY(556px);opacity:0;    }
}
.scan { animation: scan 5.5s linear infinite 1.2s; }
</style>

<!-- FR4 substrate -->
<rect x="18" y="12" width="364" height="556" rx="8" fill="#1a5c2a"/>
